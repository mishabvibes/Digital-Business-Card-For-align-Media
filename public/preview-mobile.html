<!doctype html>
<html>
  <head>
    <title>Align Media — mobile preview</title>
    <meta name="robots" content="noindex,nofollow" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      body {
        margin: 0;
        background: #e8e6ed;
        display: flex;
        flex-direction: column;
        align-items: center;
        font: 14px Arial;
        color: #655b75;
      }
      header {
        padding: 20px;
        display: flex;
        gap: 12px;
        align-items: center;
      }
      button {
        padding: 10px;
        border: 1px solid #ccc;
        background: #fff;
        border-radius: 8px;
        cursor: pointer;
      }
      iframe {
        width: 390px;
        height: calc(100dvh - 105px);
        border: 8px solid #302c36;
        border-radius: 32px;
        background: #f5f4ef;
        box-shadow: 0 15px 50px #0002;
        max-width: calc(100vw - 24px);
      }
    </style>
  </head>
  <body>
    <header>
      Mobile preview
      <button onclick="document.querySelector('iframe').style.width = '360px'">
        360</button
      ><button onclick="document.querySelector('iframe').style.width = '390px'">
        390</button
      ><button onclick="document.querySelector('iframe').style.width = '430px'">
        430</button
      ><a href="/">Full site ↗</a>
    </header>
    <iframe src="/" title="Align Media mobile preview"></iframe>
  </body>
</html>
